<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TaskCanvas</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <!-- 게스트 입장 화면 -->
    <section id="view-join" class="view" hidden>
        <form id="join-form" class="card">
            <h1>TaskCanvas</h1>
            <p class="muted">이름과 초대 코드를 입력하면 프로젝트 화이트보드에 참여합니다.</p>
            <label>표시 이름
                <input id="join-name" type="text" maxlength="60" autocomplete="nickname" required>
            </label>
            <label>초대 코드
                <input id="join-code" type="text" maxlength="120" autocomplete="off" spellcheck="false" required>
            </label>
            <button type="submit" class="primary">입장</button>
            <p id="join-error" class="error" role="alert"></p>
        </form>
    </section>

    <!-- 프로젝트·보드 선택 화면 -->
    <section id="view-boards" class="view" hidden>
        <div class="card wide">
            <header class="row between">
                <div>
                    <h1 id="boards-project-title">프로젝트</h1>
                    <p class="muted"><span id="boards-guest-name"></span> · 역할 <strong id="boards-role"></strong></p>
                </div>
                <button id="boards-leave" type="button">나가기</button>
            </header>
            <ul id="boards-list" class="board-list"></ul>
            <form id="board-create-form" class="row">
                <input id="board-create-title" type="text" maxlength="120" placeholder="새 보드 이름" required>
                <button type="submit" class="primary">보드 만들기</button>
            </form>
            <p id="boards-error" class="error" role="alert"></p>
        </div>
    </section>

    <!-- 화이트보드 화면 -->
    <section id="view-board" class="view board-layout" hidden>
        <header class="topbar">
            <button id="board-back" type="button" title="보드 목록으로">‹ 보드</button>
            <select id="board-switch" title="보드 전환"></select>
            <ul id="participants" class="participants" title="참여자"></ul>
            <span class="spacer"></span>
            <span id="conn-status" class="badge" data-state="offline">연결 끊김</span>
            <span id="save-status" class="badge" data-state="idle">대기</span>
        </header>

        <aside class="toolbar" id="toolbar">
            <button type="button" data-tool="select" title="선택·이동 (V)">↖</button>
            <button type="button" data-tool="pen" class="active" title="펜 (P)">✎</button>
            <button type="button" data-tool="rect" title="사각형 (R)">▭</button>
            <button type="button" data-tool="ellipse" title="원 (O)">◯</button>
            <button type="button" data-tool="pan" title="이동 (H / Space+드래그)">✥</button>
            <hr>
            <button type="button" id="fit-view" title="화면 맞춤">⤢</button>
        </aside>

        <main class="stage">
            <canvas id="board-canvas"></canvas>
            <div id="toast" class="toast" hidden></div>
        </main>

        <aside class="props">
            <h2>속성</h2>
            <label>색상 <input id="prop-color" type="color" value="#222222"></label>
            <label>굵기 <input id="prop-width" type="range" min="1" max="30" value="3"> <output id="prop-width-out">3</output></label>
            <label class="row"><input id="prop-fill-on" type="checkbox"> 채우기</label>
            <label>채우기 색 <input id="prop-fill" type="color" value="#fff59d" disabled></label>
            <hr>
            <p class="muted small" id="selection-info"></p>
            <p class="muted small" id="props-role-note"></p>
            <p class="muted small">V: 선택 후 드래그로 이동, 속성 변경 시 적용<br>Delete: 선택 객체 삭제<br>마우스 휠: 확대·축소<br>Space+드래그: 화면 이동<br>Esc: 취소·선택 해제</p>
        </aside>
    </section>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/realtime.js"></script>
    <script src="js/canvas.js"></script>
    <script src="js/tools.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
