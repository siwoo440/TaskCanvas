<!DOCTYPE html> <!-- HTML 문서 형식 -->
<html lang="ko"> <!-- 한국어 문서 -->
<head> <!-- 문서 설정 시작 -->
    <meta charset="utf-8"> <!-- 한글 문자 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- 모바일 화면 크기 설정 -->
    <meta name="description" content="TaskCanvas 회원가입"> <!-- 가입 화면 설명 -->
    <title>회원가입 — TaskCanvas</title> <!-- 브라우저 제목 -->
    <link rel="stylesheet" href="css/app.css"> <!-- 기존 공통 스타일 -->
    <link rel="stylesheet" href="css/member-auth.css"> <!-- 회원 화면 스타일 -->
</head> <!-- 문서 설정 마침 -->
<body class="auth-page"> <!-- 회원가입 화면 시작 -->
    <header class="site-header"> <!-- 공통 상단 영역 -->
        <div class="site-inner row between"> <!-- 상단 가로 배치 -->
            <a href="/" class="logo"><span class="logo-mark" aria-hidden="true"></span>TaskCanvas</a> <!-- 홈 이동 로고 -->
            <nav class="row member-controls" aria-label="회원 계정"> <!-- 회원 계정 메뉴 -->
                <a id="member-login" class="member-button" href="/login.html" hidden>로그인</a> <!-- 로그인 이동 링크 -->
                <span id="member-account" class="member-account" hidden><strong id="member-name"></strong><span class="small muted">회원</span></span> <!-- 현재 회원 이름 -->
                <button type="button" id="member-logout" hidden>로그아웃</button> <!-- 회원 로그아웃 버튼 -->
                <button type="button" id="member-retry" hidden>다시 확인</button> <!-- 계정 재확인 버튼 -->
            </nav> <!-- 회원 메뉴 마침 -->
        </div> <!-- 상단 배치 마침 -->
        <div class="site-inner member-status-container"><p id="member-status-message" class="member-status-message" role="status">계정 확인 중…</p></div> <!-- 회원 상태 안내 -->
    </header> <!-- 상단 영역 마침 -->
    <main class="auth-main"> <!-- 회원가입 본문 -->
        <section class="card auth-card" aria-labelledby="auth-title"> <!-- 회원가입 카드 -->
            <p class="eyebrow">TaskCanvas 회원 계정</p> <!-- 화면 구분 안내 -->
            <h1 id="auth-title">회원가입</h1> <!-- 화면 제목 -->
            <p class="muted auth-description">사용할 계정을 만들어 주세요. 작업실은 초대 코드로 입장할 수 있습니다.</p> <!-- 가입 안내 -->
            <form id="member-auth-form" class="auth-form" data-mode="register" action="/register.html" method="post"> <!-- 회원가입 입력 양식 -->
                <label for="login-id">아이디</label> <!-- 아이디 입력 이름 -->
                <input id="login-id" name="login_id" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="40" aria-describedby="login-id-help" required autofocus> <!-- 가입 아이디 입력 -->
                <p id="login-id-help" class="muted small auth-help">3~40자의 영문·숫자·마침표·밑줄·하이픈, 첫 글자는 영문·숫자. 영문 대문자는 소문자로 저장됩니다.</p> <!-- 아이디 규칙 안내 -->
                <label for="display-name">이름</label> <!-- 표시 이름 입력 이름 -->
                <input id="display-name" name="display_name" type="text" autocomplete="name" aria-describedby="display-name-help" required> <!-- 회원 표시 이름 입력 -->
                <p id="display-name-help" class="muted small auth-help">화면에 표시할 이름 1~60자</p> <!-- 이름 길이 안내 -->
                <label for="password">비밀번호</label> <!-- 비밀번호 입력 이름 -->
                <div class="password-field"> <!-- 비밀번호와 보기 버튼 묶음 -->
                    <input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-help" required> <!-- 새 비밀번호 입력 -->
                    <button type="button" class="password-visibility-button" data-password-target="password" aria-controls="password" aria-label="누르는 동안 비밀번호 보기" aria-pressed="false" title="누르는 동안 비밀번호 보기"> <!-- 일시 보기 버튼 -->
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg> <!-- 눈 모양 아이콘 -->
                    </button> <!-- 일시 보기 버튼 마침 -->
                </div> <!-- 비밀번호 묶음 마침 -->
                <p id="password-help" class="muted small auth-help">8자 이상, UTF-8 기준 72바이트 이하. 한글 등은 글자당 여러 바이트입니다.</p> <!-- 비밀번호 규칙 안내 -->
                <label for="password-confirm">비밀번호 확인</label> <!-- 확인 입력 이름 -->
                <div class="password-field"> <!-- 확인 비밀번호와 보기 버튼 묶음 -->
                    <input id="password-confirm" name="password_confirm" type="password" autocomplete="new-password" required> <!-- 새 비밀번호 재입력 -->
                    <button type="button" class="password-visibility-button" data-password-target="password-confirm" aria-controls="password-confirm" aria-label="누르는 동안 비밀번호 확인 보기" aria-pressed="false" title="누르는 동안 비밀번호 확인 보기"> <!-- 확인 비밀번호 일시 보기 -->
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg> <!-- 눈 모양 아이콘 -->
                    </button> <!-- 확인 비밀번호 보기 마침 -->
                </div> <!-- 확인 비밀번호 묶음 마침 -->
                <p id="auth-error" class="error auth-feedback" role="alert" tabindex="-1" hidden></p> <!-- 가입 오류 안내 -->
                <p id="auth-status" class="notice auth-feedback" role="status" hidden></p> <!-- 가입 진행 안내 -->
                <button type="submit" id="auth-submit" class="primary auth-submit">회원가입</button> <!-- 가입 제출 버튼 -->
            </form> <!-- 가입 양식 마침 -->
            <p class="auth-other">이미 계정이 있으신가요? <a href="/login.html">로그인</a></p> <!-- 로그인 이동 링크 -->
            <a class="auth-home" href="/">홈으로 돌아가기</a> <!-- 홈 이동 링크 -->
            <noscript><p class="error">회원가입하려면 브라우저에서 JavaScript를 켜 주세요.</p></noscript> <!-- 스크립트 비활성 안내 -->
        </section> <!-- 회원가입 카드 마침 -->
    </main> <!-- 가입 본문 마침 -->
    <script src="js/config.js"></script> <!-- API 접속 설정 -->
    <script src="js/api.js"></script> <!-- 공통 API 호출 도우미 -->
    <script src="js/member-status.js"></script> <!-- 회원 상태와 로그아웃 처리 -->
    <script src="js/member-auth.js"></script> <!-- 회원가입 양식 처리 -->
    <script src="js/password-visibility.js"></script> <!-- 누르는 동안만 비밀번호 표시 -->
</body> <!-- 회원가입 화면 마침 -->
</html> <!-- 문서 마침 -->
