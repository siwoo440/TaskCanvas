<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title"> <!-- 관리자 정사각형 그림 영역 -->
    <title id="title">왕관과 방패 모양 관리자 역할</title> <!-- 관리자 그림 설명 -->
    <g id="role-symbol"> <!-- 관리자 도형 묶음 -->
        <path id="admin-shield" d="M80 39l52 19v33c0 25-18 43-52 51-34-8-52-26-52-51V58z" fill="#6d8fe8" stroke="#293d91" stroke-width="7" stroke-linejoin="round"/> <!-- 관리자 방패 -->
        <path id="admin-crown-on-shield" d="M47 63l5-33 16 14 12-24 12 24 16-14 5 33z" fill="#ffd43b" stroke="#293d91" stroke-width="7" stroke-linejoin="round"/> <!-- 세 봉우리 왕관 -->
        <g id="admin-crown-details"> <!-- 왕관 세부 장식 묶음 -->
            <path d="M49 52h62v11H49z" fill="#ffe783"/> <!-- 왕관 하단 띠 -->
            <path d="M50 52h60" fill="none" stroke="#293d91" stroke-width="4" stroke-linecap="round"/> <!-- 왕관 띠 윗선 -->
            <circle data-crown-jewel="left" cx="62" cy="58" r="4" fill="#ffffff" stroke="#293d91" stroke-width="3"/> <!-- 왼쪽 왕관 보석 -->
            <circle data-crown-jewel="center" cx="80" cy="58" r="4" fill="#6d8fe8" stroke="#293d91" stroke-width="3"/> <!-- 가운데 왕관 보석 -->
            <circle data-crown-jewel="right" cx="98" cy="58" r="4" fill="#ffffff" stroke="#293d91" stroke-width="3"/> <!-- 오른쪽 왕관 보석 -->
        </g> <!-- 왕관 세부 장식 묶음 종료 -->
        <path d="M49 63h62" fill="none" stroke="#293d91" stroke-width="7" stroke-linecap="round"/> <!-- 왕관 아래 테두리 -->
    </g> <!-- 관리자 도형 묶음 종료 -->
</svg> <!-- 관리자 그림 종료 -->
